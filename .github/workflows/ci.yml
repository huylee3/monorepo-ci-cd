name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:54332/test_db
      WIREMOCK_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 12.4.2
          runtime: node@24
          cache: true

      - name: Install packages
        run: pnpm install

      - name: Check format, typecheck, unit test
        run: | 
          {
            echo "## Typecheck and Unit Test"
            echo
          } >> $GITHUB_STEP_SUMMARY
          pnpm typecheck && pnpm test

      # -d returns control to the job; --wait blocks only until healthchecks pass.
      - name: Start test database and WireMock
        run: docker compose -f compose.ci.yml up -d --wait

      - name: Migrate test database
        run: pnpm db:generate && pnpm db:migrate:test

      - name: Run api mock test
        run: |
          {
            echo "## API Mock Test"
            echo
          } >> $GITHUB_STEP_SUMMARY
          pnpm test:mock

      - name: Run integration test
        run: |
          {
            echo "## Integration Test"
            echo
          } >> $GITHUB_STEP_SUMMARY
          pnpm test:api

      - name: Save compose logs
        if: always()
        run: |
          mkdir artifacts
          docker compose -f compose.ci.yml ps > artifacts/compose-ps.txt
          docker compose -f compose.ci.yml logs --no-color --no-log-prefix > artifacts/compose.log

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3

        
        
