name: Delivery on Main

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
      - name: Install packages
        run: pnpm install
      
      - name: Check format, typecheck, unit test
        run: |
          {
            echo "## -- Typecheck and Unit Test"
            echo
          } >> $GITHUB_STEP_SUMMARY
          pnpm typecheck &&  pnpm test

      - name: "Start services: db, api, web"
        run: docker compose -f compose.release.yml up -d --wait

      - name: Migrate against test database
        run: pnpm db:generate && pnpm db:migrate
        env:
          DIRECT_URL: postgresql://test:test@127.0.0.1:54432/test_db
          DATABASE_URL: postgresql://test:test@127.0.0.1:54432/test_db

      - name: E2E Test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:54432/test_db
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Save compose logs
        if: always()
        run: |
          mkdir build-logs
          docker compose -f compose.release.yml ps > build-logs/compose-ps.txt
          docker compose -f compose.release.yml logs --no-color --no-log-prefix > build-logs/compose.log
      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 3
