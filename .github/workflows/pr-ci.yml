name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Check code formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test
