services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:54432:5432"

  api:
    image: ${DOCKEHUB_USERNAME}/todo-api:${IMAGE_TAG:-local} 
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
      labels:
        org.opencontainers.image.revision: ${IMAGE_TAG:-local}
        org.opencontainers.image.source: https://github.com/${GITHUB_REPOSITORY}
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://test:test@db:5432/test_db
      DIRECT_URL: postgresql://test:test@db:5432/test_db
      JWT_SECRET: test-secret-only-with-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", 
        "node",
        "-e",
        "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  web:
    image: ${DOCKERHUB_USERNAME}/todo-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      labels:
        org.opencontainers.image.revision: ${IMAGE_TAG:-local}
        org.opencontainers.image.source: https://github.com/${GITHUB_REPOSITORY}
    environment:
      API_URL: http://api:3001
      HOST: 0.0.0.0
      PORT: 3000
      CI: true
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy


