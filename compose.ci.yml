services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:54332:5432"

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:8080:8080"
